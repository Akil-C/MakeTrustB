name: Nexora Backend Security & CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 1: Java 21 Toolchain Setup & Maven Compilation
  # ─────────────────────────────────────────────────────────────────────────────
  compile-and-verify:
    name: ☕ Maven Compilation & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Source
        uses: actions/checkout@v4

      - name: Setup Eclipse Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify Maven Dependencies & Compile
        run: mvn clean compile -B

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 2: Static Application Security Testing (SAST) & Secret Leak Detection
  # ─────────────────────────────────────────────────────────────────────────────
  security-sast:
    name: 🛡️ SAST Audit & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Source
        uses: actions/checkout@v4

      - name: Setup Eclipse Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Scan for Secret Leaks & API Credentials
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 3: Production Package & Immutable Artifact Creation
  # ─────────────────────────────────────────────────────────────────────────────
  package-artifact:
    name: 📦 Package Spring Boot Executable JAR
    runs-on: ubuntu-latest
    needs: [compile-and-verify, security-sast]
    steps:
      - name: Checkout Backend Source
        uses: actions/checkout@v4

      - name: Setup Eclipse Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Executable JAR (-DskipTests for CI speed)
        run: mvn clean package -DskipTests -B

      - name: Compute Build SHA256 Checksum
        run: |
          sha256sum target/*.jar > target/checksums.txt
          cat target/checksums.txt

      - name: Archive Production JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-backend-jar
          path: target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 4: Container Security & Docker CVE Vulnerability Scan
  # ─────────────────────────────────────────────────────────────────────────────
  docker-security-scan:
    name: 🐳 Docker Container Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [package-artifact]
    steps:
      - name: Checkout Backend Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container (Non-root user)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nexora-backend:${{ github.sha }}
          load: true

      - name: Scan Container Image for High/Critical CVEs
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'nexora-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 5: Gated Production Deployment
  # ─────────────────────────────────────────────────────────────────────────────
  production-deploy:
    name: 🚀 Gated Production Cloud Release
    runs-on: ubuntu-latest
    needs: [docker-security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.nexora.marketplace
    steps:
      - name: Download Production JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: nexora-backend-jar
          path: target

      - name: Verify Artifact Signature & Readiness
        run: |
          echo "Verifying production executable integrity..."
          ls -lh target/*.jar
          echo "Backend production artifact is verified and ready for zero-downtime deployment."
