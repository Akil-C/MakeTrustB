# Application Configuration
spring.application.name=markettrust-backend
server.port=${SERVER_PORT:${PORT:8080}}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/markettrust?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${JWT_SECRET:markettrust-super-secret-jwt-key-change-this-in-production-min-256-bits}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# App Mode (development | production)
app.mode=${APP_MODE:development}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Platform Settings
app.platform.fee-credits=${PLATFORM_FEE_CREDITS:2}
app.platform.max-product-images=${MAX_PRODUCT_IMAGES:8}
app.platform.max-listing-days=${MAX_LISTING_DAYS:90}
app.platform.default-search-radius-km=${DEFAULT_SEARCH_RADIUS_KM:10}

# Gemini AI
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
app.gemini.enabled=${GEMINI_ENABLED:true}

# Google Maps
app.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.google-maps.enabled=${GOOGLE_MAPS_ENABLED:true}

# Cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.enabled=${CLOUDINARY_ENABLED:true}

# Cloudflare Turnstile CAPTCHA
app.turnstile.site-key=${TURNSTILE_SITE_KEY:}
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
app.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
app.turnstile.enabled=${TURNSTILE_ENABLED:false}

# Firebase (optional)
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.info.title=MarketTrust API
springdoc.info.description=AI-Powered Trusted Marketplace REST API
springdoc.info.version=1.0.0

# Logging
logging.level.com.markettrust=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Async
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

# Cache
spring.cache.type=simple
